{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "katch.fullname" . }}
  labels:
    {{- include "katch.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # 必须是整个 /：路径的第一段是上游主机名，按前缀挑路径等于把上游挑着代理。
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "katch.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
