# k3s-master-1 那台集群的实际部署值，由 .gitea/workflows/deploy.yaml 使用。
#
# 为什么不只用 helm 的 release 记住这些值：那样「线上到底跑的什么」就只能去集群里问，
# 而 git 里读不出来。集群相关的东西（域名、storageClass、ingress class）入库，
# 改的时候是一份可 review 的 diff。
#
# 用法（CI 里就是这么调的）：
#   helm upgrade --install katch deploy/helm/katch -n app \
#     -f deploy/helm/katch/values-ggnb.yaml --set image.tag=main.<短 sha>

image:
  repository: gitea.icodef.com/codfrm/katch
  # tag 每次由 CI --set 进来。留空会用 Chart.yaml 的 appVersion，不是想要的结果，
  # 所以 CI 必须给。
  tag: ""
  pullPolicy: IfNotPresent

# 镜像在 gitea 的私有包里，节点匿名拉不到：报 401 而不是「找不到镜像」。
# dockersecret 是 ns app 里本来就有的一份 dockerconfigjson，那批应用共用。
imagePullSecrets:
  - name: dockersecret

# 缓存、sqlite 库和日志都在这个卷上。ssd-nfs-client 是集群里那个 NFS provisioner，
# 换 storageClass 等于把数据搬到别的卷上，别在升级时顺手改。
persistence:
  enabled: true
  storageClass: ssd-nfs-client
  size: 50Gi

# 集群入口是 k3s 自带的 Traefik + Gateway API（codfrm/k3s-deployment 的 gateway/），
# 不再有 ingress-nginx。证书（*.ggnb.top / *.scriptcat.org）在网关上按 SNI 选。
# 原来 ingress 注解管的几件事在网关上已经满足：Traefik 不缓冲响应、不限请求体，
# 响应头没有 4k 上限；entryPoint 读超时为 0（不限）、空闲 600s。
ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    # 同时挂 http：katch.scriptcat.org 经 Cloudflare（Flexible）用 HTTP 回源；
    # 直接打 http 的请求由网关统一 301 到 https
    - name: public
      namespace: gateway
      sectionName: http
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    # 经 Cloudflare：上海直连 silicloud 丢包严重，大镜像层拉不完，走 CF 后多数时候快几十倍
    - katch.scriptcat.org
    # 直连，保留给已经配好它的客户端
    - katch.ggnb.top
